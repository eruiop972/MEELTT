<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
  <meta name="theme-color" content="#d42f6a">
  <meta name="robots" content="index,follow">
  <title>Melt Cake | كيك وحلويات في بنغازي</title>
  <meta name="description" content="متجر Melt Cake للكيك والحلويات في بنغازي. اختاري منتجاتك المفضلة وأرسلي طلبك عبر واتساب.">
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header" role="banner">
    <div class="header-content">
      <a class="logo-link" href="#home" aria-label="Melt Cake - الرئيسية">
        <img src="./assets/logo.svg" alt="شعار Melt Cake" class="logo" width="80" height="50">
      </a>
      <div class="header-actions">
        <a class="icon-btn whatsapp-link" href="#" aria-label="واتساب" title="راسلينا على واتساب">
          <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20"><path d="M17.6 6.4A8 8 0 0 0 4 12c0 1.4.3 2.8.9 4L4 20l4.3-1.1c1.2.7 2.6 1.1 4.1 1.1a8 8 0 0 0 5.3-14.6zm-4.4 12H8.4v-1.8h4.8v1.8zm0-2.5H8.4v-1.8h4.8v1.8zm0-2.5H8.4V8.6h4.8v1.8z" fill="currentColor"/></svg>
        </a>
        <button class="icon-btn cart-btn" id="cartBtn" type="button" aria-label="السلة" title="عرض السلة">
          <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20"><path d="M7 4H3V2h5a1 1 0 0 1 1 .8L9.4 5H21a1 1 0 0 1 1 1.2l-1.4 7A2 2 0 0 1 18.6 15H9.7a2 2 0 0 1-2-1.6L6.1 6 5.4 4H7zm2.8 15a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z" fill="currentColor"/></svg>
          <span class="cart-badge" id="cartBadge" aria-live="polite">0</span>
        </button>
      </div>
    </div>
  </header>

  <main id="home">
    <section class="hero-section">
      <div class="hero-content">
        <h1>أهلاً بيك في Melt Cake 🍰</h1>
        <p>كيك وحلويات لذيذة في بنغازي</p>
      </div>
    </section>

    <section class="categories-section" id="categories">
      <h2>اختاري اللي يعجبك</h2>
      <div class="categories-grid" id="categoriesGrid"></div>
    </section>

    <section class="products-section" id="products"></section>

    <section class="faq-section">
      <div class="faq-container">
        <h2>الأسئلة الشائعة</h2>
        <div class="faq" id="faq"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <small>© Melt Cake 2024 — جميع الحقوق محفوظة</small>
    <a id="facebookLink" href="#" target="_blank" rel="noopener" class="social-link">فيسبوك</a>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./site-data.js"></script>
  <script src="./app.js" defer></script>
</body>
</html>
